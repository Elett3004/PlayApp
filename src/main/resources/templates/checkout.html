<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Pedido</title>
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <link rel="stylesheet" href="/css/importJakartaFont.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/chat-widget.css">
  <link rel="icon" href="/img/Logo.png" type="image/png">
</head>
<body class="jakarta-regular">

<header th:replace="~{components/navbar :: publicNavbar('tienda')}"></header>

<div class="container mt-5">


  <div class="row justify-content-center">
    <div class="col-6">
      <div class="card">
        <div class="card-body p-3">
          <h2 class="jakarta-bold">Verificación</h2>
          <h5 class="card-title jakarta-medium text-primary">Carrito de Compras</h5>
          <div class="row border-bottom mb-1" th:each="carritoItem : ${checkout}">
              <div class="col-1"><a th:href="@{/cart/rm/{id}(id=${carritoItem.getProductoId()})}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
                  <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0"/>
                </svg>
              </a></div>
              <div class="col-5" th:text="${carritoItem.getNombre()}+' x '+${carritoItem.getCantidad()}"></div>
              <div class="col-6 d-flex justify-content-end" th:text="${#numbers.formatCurrency(carritoItem.getPrecio()*carritoItem.getCantidad())}"></div>
          </div>
          <div class="row mb-3">
            <div class="col-6 jakarta-bold">TOTAL</div>
            <div class="col-6 jakarta-bold text-primary d-flex justify-content-end" th:text="${#numbers.formatCurrency(total)}"></div>
          </div>
          <div class="d-flex justify-content-end">
            <a href="/cart/checkout/proceed" class="btn btn-primary">Comprar</a>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<div th:replace="~{fragments/chat-widget :: playappChatWidget}"></div>
<script src="/js/chat-widget.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
