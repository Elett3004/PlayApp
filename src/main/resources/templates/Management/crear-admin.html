<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear administrador</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="/css/importJakartaFont.css">
    <link rel="icon" href="/img/Logo.png" type="image/png">
</head>
<body class="container-fluid jakarta-regular">
<main class="row flex-nowrap">
    <div class="col-2 border-end p-0">
        <div class="d-flex flex-column flex-shrink-0 p-3 bg-body-tertiary min-vh-100">
            <a href="/manager/dashboard"
               class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
                <img src="/img/Logo.png" class="bi pe-none me-2" width="40" height="32" alt="home"/>
                <span class="fs-4 jakarta-bold">Playapp</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li>
                    <a href="/manager/dashboard" class="nav-link link-body-emphasis">
                        <img src="/img/icons/speedometer2.svg" class="bi pe-none me-2" width="16" height="16" alt="dashboard"/>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="/manager/orders" class="nav-link link-body-emphasis">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-stickies me-2" viewBox="0 0 16 16">
                            <path d="M1.5 0A1.5 1.5 0 0 0 0 1.5V13a1 1 0 0 0 1 1V1.5a.5.5 0 0 1 .5-.5H14a1 1 0 0 0-1-1z"/>
                            <path d="M3.5 2A1.5 1.5 0 0 0 2 3.5v11A1.5 1.5 0 0 0 3.5 16h6.086a1.5 1.5 0 0 0 1.06-.44l4.915-4.914A1.5 1.5 0 0 0 16 9.586V3.5A1.5 1.5 0 0 0 14.5 2zM3 3.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 .5.5V9h-4.5A1.5 1.5 0 0 0 9 10.5V15H3.5a.5.5 0 0 1-.5-.5zm7 11.293V10.5a.5.5 0 0 1 .5-.5h4.293z"/>
                        </svg>
                        Ordenes
                    </a>
                </li>
                <li>
                    <a href="/manager/products" class="nav-link link-body-emphasis">
                        <img src="/img/icons/boxes.svg" class="bi pe-none me-2" width="16" height="16" alt="inventory"/>
                        Catalogo
                    </a>
                </li>
                <li>
                    <a href="/manager/prediccion" class="nav-link link-body-emphasis">
                        <img src="/img/icons/graph-up.svg" class="bi pe-none me-2" width="16" height="16" alt="predict"/>
                        Predecir Ventas
                    </a>
                </li>
                <li>
                    <a href="/manager/modelo-matematico" class="nav-link link-body-emphasis">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi me-2" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M3 1.5A1.5 1.5 0 0 1 4.5 0h7A1.5 1.5 0 0 1 13 1.5v13a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 14.5zM4.5 1a.5.5 0 0 0-.5.5V4h8V1.5a.5.5 0 0 0-.5-.5zM4 5v9.5a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V5zm1 1h1v1H5zm2 0h1v1H7zm2 0h1v1H9zm-4 2h1v1H5zm2 0h1v1H7zm2 0h1v1H9zm-4 2h1v1H5zm2 0h1v1H7zm2 0h1v3H9z"/>
                        </svg>
                        Modelo Matematico
                    </a>
                </li>
                <li th:if="${adminGlobal}">
                    <a href="/manager/admins/new" class="nav-link active">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi me-2" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                            <path d="M8 9a5 5 0 0 0-5 5 .5.5 0 0 0 .5.5h5.256A4.5 4.5 0 0 1 8 9"/>
                            <path d="M13.5 10a.5.5 0 0 1 .5.5V12h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V13h-1.5a.5.5 0 0 1 0-1H13v-1.5a.5.5 0 0 1 .5-.5"/>
                        </svg>
                        Crear Admins
                    </a>
                </li>
            </ul>
            <hr>
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center link-body-emphasis text-decoration-none dropdown-toggle"
                   data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="https://github.com/mdo.png" alt="" width="32" height="32" class="rounded-circle me-2">
                    <strong class="admin-display-name d-inline-block text-truncate" style="max-width: 150px;" th:text="${nombreAdmin}"></strong>
                </a>
                <ul class="dropdown-menu text-small shadow"
                    th:insert="fragments/logout-button :: logoutButton">
                </ul>
            </div>
        </div>
    </div>

    <div class="col-10 p-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb breadcrumb-chevron p-3 bg-body-tertiary rounded-3">
                <li class="breadcrumb-item active" aria-current="page">Crear administradores</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-7 col-xl-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 jakarta-bold mb-2">Crear administrador</h1>
                        <p class="text-muted mb-4">Solo el administrador global puede crear nuevas cuentas administrativas.</p>

                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <div th:if="${registroExitoso}" class="alert alert-success" th:text="${registroExitoso}"></div>

                        <form th:action="@{/manager/admins/new}" method="post" th:object="${formulario}">
                            <div class="mb-3">
                                <label for="nombreCompleto" class="form-label fw-bold">Nombre del restaurante</label>
                                <input type="text" class="form-control" id="nombreCompleto" th:field="*{nombreCompleto}" required>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label fw-bold">Correo electronico</label>
                                <input type="email" class="form-control" id="correo" th:field="*{correo}" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold">Contrasena</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Crear administrador</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:insert="fragments/logout-modal :: logoutModal"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
